# ── Open Supply-Chain Lifecycle Tracker — base compose file ────────────────────
#
# This file is PRODUCTION-INTENT:
#   * No database or cache ports are published to the host.
#   * Secrets have no weak fallback — a missing .env fails loudly instead of
#     silently booting with a publicly-known key.
#   * nginx is the only service that listens on the host (profile: tls).
#
# Local development is layered on top of this by docker-compose.override.yml,
# which Docker Compose loads automatically for `docker compose up`. Deploying
# with an explicit `-f docker-compose.yml` skips the override entirely.
#
#   Local dev      : docker compose up
#   Single host    : docker compose -f docker-compose.yml --profile tls up -d
#   Separate hosts : deploy the backend/ and frontend/ directories individually

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oslt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:-oslt_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oslt_user} -d ${POSTGRES_DB:-oslt_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No `ports:` — other services reach this as `db:5432` over the internal
    # network. Publishing 5432 would expose the database to the internet.

  # ── Redis (cache + rate limiter) ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Append-only persistence so rate-limit windows and cache survive a restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    # No `ports:` — same reasoning as the database above.

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-oslt_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-oslt_db}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-oslt_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-oslt_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}

      # Production runs migrations via entrypoint.sh and must not auto-create tables.
      APP_ENV: ${APP_ENV:-production}

      # No fallbacks on purpose: a missing secret must stop the deploy.
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required - generate with openssl rand -hex 32}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required - generate with openssl rand -hex 32}
      ADMIN_SECRET: ${ADMIN_SECRET:?ADMIN_SECRET is required - generate with openssl rand -hex 32}

      # Empty API_KEY leaves read endpoints open — set it for production.
      API_KEY: ${API_KEY:-}
      API_KEY_HEADER: ${API_KEY_HEADER:-X-API-Key}
      API_KEY_MAX_AGE_SECONDS: ${API_KEY_MAX_AGE_SECONDS:-300}

      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      SIGNATURE_MAX_AGE_SECONDS: ${SIGNATURE_MAX_AGE_SECONDS:-300}

      # Must be a JSON array. Add your public origin(s) in .env before deploying,
      # otherwise the browser will block every API call.
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* is compiled into the client bundle, so this must be the
        # URL a browser can reach — not an internal Docker hostname. Set it to
        # your public API origin before deploying.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend

  # ── nginx TLS reverse proxy (optional — for single-host deploys) ────────────
  # Serving both apps from one origin removes CORS entirely, because the browser
  # only ever sees nginx. Enable with: --profile tls
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      # ACME webroot — certbot writes challenge tokens here over plain HTTP
      - ./nginx/certbot:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    profiles:
      - tls

volumes:
  pgdata:
  redisdata:
